version: '3.9'

# refer: https://docs.docker.com/compose/compose-file/05-services/
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: jenkins/jenkins-docker-cli:2.568.3-lts-jdk21
    container_name: local_jenkins
    restart: always
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Duser.timezone=Asia/Shanghai"
    group_add:
      - "0"
    volumes:
      - ./data:/var/jenkins_home
      # 注意：挂载宿主机docker.sock等价于给予容器宿主机的完全控制权限，仅用于本机隔离的开发环境
      - /var/run/docker.sock:/var/run/docker.sock
