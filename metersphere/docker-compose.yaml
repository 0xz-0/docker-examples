services:
  metersphere:
    image: ${METERSPHERE_IMAGE:-metersphere/metersphere-ce-allinone:v3.6.10-lts}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${METERSPHERE_HTTP_PORT:-8081}:8081"
    volumes:
      - metersphere_data:/opt/metersphere/data
      - metersphere_conf:/opt/metersphere/conf
      - metersphere_logs:/opt/metersphere/logs
    stop_grace_period: 120s

volumes:
  metersphere_data:
  metersphere_conf:
  metersphere_logs:
