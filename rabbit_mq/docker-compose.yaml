services:
  rabbitmq:
    image: rabbitmq:4.3.7-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set a strong RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-app}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - type: bind
        source: ./rabbitmq.conf
        target: /etc/rabbitmq/conf.d/20-custom.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    stop_grace_period: 60s

volumes:
  rabbitmq_data:
