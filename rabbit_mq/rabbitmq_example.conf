# Copy to rabbitmq.conf. Do not put credentials in this sample.
# Compose publishes these container ports on host loopback only.
listeners.tcp.default = 5672
management.tcp.port = 15672

# Restrict guest to loopback even if it is created manually later.
loopback_users.guest = true

# Stop accepting publishes under disk pressure; adjust for the host workload.
disk_free_limit.absolute = 1GB

log.console = true
log.console.level = info
log.file = false
